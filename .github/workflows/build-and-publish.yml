# AMS Count · build แอป APK + เผยแพร่เว็บขึ้น GitHub Pages
# ทำงานเองทุกครั้งที่อัปโหลดไฟล์ขึ้น branch main (หรือกด Run workflow เองที่แท็บ Actions)
name: Build APK + Publish web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ยังไม่ได้ใส่ Secret AMS_KEYSTORE_BASE64 (ดูคู่มือข้อ 5)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ams-count.jks"
          echo "AMS_KEYSTORE_FILE=$RUNNER_TEMP/ams-count.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          AMS_BUILD_NUMBER: ${{ github.run_number }}
          AMS_KEYSTORE_PASSWORD: ${{ secrets.AMS_KEYSTORE_PASSWORD }}
          AMS_KEY_ALIAS: ams-count
          AMS_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: gradle -p android assembleRelease --no-daemon

      - name: Assemble website
        run: |
          mkdir -p _site/download
          cp -r web/. _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/download/ams-count.apk
          echo "{\"version\":\"1.0.${{ github.run_number }}\",\"date\":\"$(TZ=Asia/Bangkok date +'%d/%m/%Y %H:%M')\"}" > _site/download/version.json
          touch _site/.nojekyll
          # list of the app's screen files + checksums → the scanner app downloads a newer set by itself
          python3 - "${{ github.run_number }}" "$(cat android/shell-version.txt)" <<'PY'
          import hashlib, json, os, sys
          files = []
          for root, _, names in os.walk('web'):
              for n in sorted(names):
                  full = os.path.join(root, n); rel = os.path.relpath(full, 'web').replace(os.sep, '/')
                  if rel == 'install.html' or rel.startswith('download/'): continue
                  files.append({'p': rel, 'sha256': hashlib.sha256(open(full, 'rb').read()).hexdigest()})
          json.dump({'build': int(sys.argv[1]), 'shell': int(sys.argv[2]), 'files': files}, open('_site/download/web-manifest.json', 'w'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ams-count-apk-1.0.${{ github.run_number }}
          path: _site/download/ams-count.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
