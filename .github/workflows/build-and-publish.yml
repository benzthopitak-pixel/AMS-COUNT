# AMS Count · build แอป APK สำหรับเครื่องยิง
# เว็บ AssetSync อยู่ที่ repo ip-one-tools โฟลเดอร์ assetsync/ (ขึ้นเว็บที่ https://inventory-tools-hub.netlify.app/assetsync/)
# workflow นี้: ดึงไฟล์เว็บชุดนั้นมาใส่ในแอป → build APK → ส่งไฟล์ดาวน์โหลด (apk + manifest) ไว้ที่ Release 'app'
# แล้วนำ assetsync-download.zip ไปวางใน ip-one-tools/assetsync/ (โฟลเดอร์ download/ + build.js)
# ทำงานเองทุกครั้งที่อัปโหลดไฟล์ขึ้น branch main (หรือกด Run workflow เองที่แท็บ Actions)
name: Build APK + Publish web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ไฟล์เว็บ AssetSync ตัวจริงอยู่ที่ ip-one-tools/assetsync → ใช้ชุดนั้นใส่ในแอป
      - uses: actions/checkout@v4
        with:
          repository: benzthopitak-pixel/ip-one-tools
          path: _src
      - name: Use AssetSync web from ip-one-tools
        run: |
          rm -rf web && mkdir web
          rsync -a --exclude download/ _src/assetsync/ web/
          rm -rf _src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ยังไม่ได้ใส่ Secret AMS_KEYSTORE_BASE64 (ดูคู่มือข้อ 5)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ams-count.jks"
          echo "AMS_KEYSTORE_FILE=$RUNNER_TEMP/ams-count.jks" >> "$GITHUB_ENV"

      - name: Stamp version
        run: echo "window.AMS_BUILD = '1.0.${{ github.run_number }}'; window.AMS_BUILT = '$(TZ=Asia/Bangkok date +'%d/%m/%Y %H:%M')';" > web/build.js

      - name: Build APK
        env:
          AMS_BUILD_NUMBER: ${{ github.run_number }}
          AMS_KEYSTORE_PASSWORD: ${{ secrets.AMS_KEYSTORE_PASSWORD }}
          AMS_KEY_ALIAS: ams-count
          AMS_UPDATE_URL: https://inventory-tools-hub.netlify.app/assetsync/
        run: gradle -p android assembleRelease --no-daemon

      - name: Assemble website
        run: |
          mkdir -p _site/download
          cp -r web/. _site/
          cp android/app/build/outputs/apk/release/app-release.apk _site/download/ams-count.apk
          echo "{\"version\":\"1.0.${{ github.run_number }}\",\"date\":\"$(TZ=Asia/Bangkok date +'%d/%m/%Y %H:%M')\"}" > _site/download/version.json
          touch _site/.nojekyll
          # list of the app's screen files + checksums → the scanner app downloads a newer set by itself
          python3 - "${{ github.run_number }}" "$(cat android/shell-version.txt)" <<'PY'
          import hashlib, json, os, sys
          files = []
          for root, _, names in os.walk('web'):
              for n in sorted(names):
                  full = os.path.join(root, n); rel = os.path.relpath(full, 'web').replace(os.sep, '/')
                  if rel == 'install.html' or rel.startswith('download/'): continue
                  files.append({'p': rel, 'sha256': hashlib.sha256(open(full, 'rb').read()).hexdigest()})
          json.dump({'build': int(sys.argv[1]), 'shell': int(sys.argv[2]), 'files': files}, open('_site/download/web-manifest.json', 'w'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ams-count-apk-1.0.${{ github.run_number }}
          path: _site/download/ams-count.apk

      # ชุดไฟล์สำหรับวางใน ip-one-tools/assetsync/ : download/ (apk, version.json, web-manifest.json) + build.js ที่ประทับเวอร์ชันแล้ว
      - name: Publish download bundle (Release 'app')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web/build.js _site/download/../build.js
          (cd _site && zip -qr ../assetsync-download.zip download build.js)
          gh release view app >/dev/null 2>&1 || gh release create app --title "AssetSync app (latest)" --notes "ไฟล์แอปล่าสุดสำหรับวางใน ip-one-tools/assetsync/ · อย่าลบ"
          gh release upload app assetsync-download.zip --clobber
