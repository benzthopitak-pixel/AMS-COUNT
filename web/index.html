/* Layout: one shell, two faces. "คอม" = wide web workspace with stage pills; "เครื่องยิง" = phone column with bottom bar + center scan button.
   Deliberately single light theme (field devices + office screens), every color set explicitly. */
:root {
  --ink: #121826; --muted: #5d6676; --bg: #f4f5fa; --card: #ffffff; --line: #e4e7ec;
  --blue: #3b5bfd; --blue-soft: #eaeeff; --blue-ink: #2e46c9;
  --lime: #d4f25a; --orange: #ff7a1a;
  --ok: #12b76a; --ok-soft: #e7f8ef; --ok-ink: #027a48;
  --warn: #f79009; --warn-soft: #fff1e6; --warn-ink: #b54708;
  --bad: #f04438; --bad-soft: #fee9e7; --bad-ink: #b42318;
  --oth: #7a5af8; --oth-soft: #f0ebff; --oth-ink: #5925dc;
  --display: 'Prompt', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.top-in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--lime); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 13px; }
.seg { display: inline-flex; background: #e9ebf3; border-radius: 999px; padding: 3px; }
.seg button { border: none; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: none; padding: 7px 13px; border-radius: 999px; background: #f2f4f7; color: #344054; font-size: 14px; }
.pill.on { background: var(--blue); color: #fff; font-weight: 600; }
.pill.done { background: var(--ok-soft); color: var(--ok-ink); }
.sync { margin-left: auto; font-size: 13px; padding: 5px 11px; border-radius: 999px; font-weight: 600; }
.s-on { background: var(--ok-soft); color: var(--ok-ink); } .s-wait { background: var(--warn-soft); color: var(--warn-ink); } .s-off { background: #f2f4f7; color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 28px; line-height: 1.2; text-wrap: balance; }
h2 { margin: 0; font-size: 19px; line-height: 1.3; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.card { background: var(--card); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.row > .grow { flex: 999 1 520px; min-width: 0; }
.row > .side { flex: 1 1 320px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

.btn.pri { background: var(--blue); color: #fff; border-color: var(--blue); }

.tbl-wrap { overflow-x: auto; border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }

td { padding: 9px 10px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover { background: #f8f9fc; } tr.sel { background: var(--blue-soft); }
.tile { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; text-align: left; border: none; }
.tile b { font-size: 15px; } .tile .p { font-size: 24px; font-weight: 700; line-height: 1.2; } .tile small { font-size: 12px; }
.bar { height: 10px; background: #eef0f6; border-radius: 6px; overflow: hidden; display: flex; }

.msg.ok { background: var(--ok-soft); color: var(--ok-ink); } .msg.bad { background: var(--bad-soft); color: var(--bad-ink); } .msg.warn { background: var(--warn-soft); color: var(--warn-ink); }
.drop { border: 2px dashed #c5cdfd; border-radius: 18px; padding: 22px; background: #f7f8ff; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
/* phone */
.phone { max-width: 440px; margin: 0 auto; min-height: calc(100vh - 60px); display: flex; flex-direction: column; background: var(--bg); }
.pbody { flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 110px; }
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bnav-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; padding: 6px 6px 10px; }
.bnav button { border: none; background: none; font-size: 12px; color: var(--muted); padding: 8px 2px; }
.bnav button.on { color: var(--blue); font-weight: 600; }
.bnav .fab { justify-self: center; width: 62px; height: 62px; margin-top: -26px; border-radius: 50%; background: var(--lime); color: var(--ink); font-weight: 700; font-size: 14px; border: 4px solid var(--card); }
.hero { background: var(--blue); color: #fff; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.dark { background: var(--ink); color: #fff; }
.areahead { border-radius: 0 0 26px 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.cnt3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.cnt3 > * { border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; border: none; color: inherit; }
.cnt3 b { font-size: 22px; line-height: 1.1; }
.tabs3 { display: flex; gap: 4px; background: #e9ebf3; border-radius: 999px; padding: 4px; }
.tabs3 button { flex: 1 1 0; border: none; background: transparent; border-radius: 999px; padding: 8px 4px; font-size: 13px; color: #475467; }
.tabs3 button.on { background: var(--card); color: var(--ink); font-weight: 600; }
.li { background: var(--card); border-radius: 16px; padding: 11px 14px; display: flex; gap: 10px; align-items: center; text-align: left; border: none; width: 100%; }
.li .t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.li .t span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.dot { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
.scanbox { border: 2px dashed var(--lime); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
#scanIn { width: 100%; border: none; border-radius: 12px; padding: 12px; font-family: var(--mono); font-size: 20px; background: #2a3242; color: #fff; text-transform: uppercase; }
#scanIn::placeholder { color: #98a2b3; text-transform: none; }
.rcard { background: var(--card); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.rcard.oth { border: 2px solid var(--oth); } .rcard.unk { border: 2px solid var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { border: 1px solid #d0d5dd; background: var(--card); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #344054; min-height: 40px; }
.tog[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.cond { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cond button { border: none; border-radius: 14px; padding: 10px 2px; font-weight: 600; font-size: 13px; background: var(--card); min-height: 44px; }
.cond button[aria-pressed="true"] { background: var(--ok); color: #fff; }
.cond button.w[aria-pressed="true"] { background: var(--warn); color: #1d0e00; }
.sheetbg { position: fixed; inset: 0; z-index: 20; background: rgb(18 24 38 / .7); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.sheet { width: 100%; max-width: 440px; background: var(--bg); border-radius: 26px 26px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 92vh; overflow-y: auto; }
.sticker { align-self: center; width: 300px; max-width: 100%; transform: rotate(-2.5deg); }
.sticker canvas { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.book { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mini { background: var(--card); border-radius: 12px; padding: 9px 11px; border: none; border-top: 6px solid var(--ok); text-align: left; display: flex; flex-direction: column; font-size: 12px; min-width: 0; }
.mini b { font-family: var(--mono); font-size: 14px; } .mini span { overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.confirm { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--bad-soft); color: var(--bad-ink); }
/* computer: side menu */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side-nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding: 16px 12px 16px max(12px, env(safe-area-inset-left, 0px)); }
.side-top { display: flex; flex-direction: column; gap: 10px; padding: 4px 6px; }
.side-top .sync { margin: 0; align-self: flex-start; }
.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: transparent; color: #344054; border-radius: 12px; padding: 10px 12px; font-size: 15px; min-height: 44px; }
.nav-item:hover { background: #f2f4f7; }
.nav-item.on { background: var(--blue); color: #fff; font-weight: 600; }
.nav-item.done:not(.on) .nav-num { background: var(--ok-soft); color: var(--ok-ink); }
.nav-num { flex: 0 0 28px; height: 28px; border-radius: 9px; background: #f2f4f7; color: #475467; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.nav-item.on .nav-num { background: rgb(255 255 255 / .2); color: #fff; }
.nav-label { flex: 1 1 auto; min-width: 0; }
.nav-badge { flex: 0 0 auto; background: var(--orange); color: #1d0e00; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.nav-sep { height: 1px; background: var(--line); margin: 6px 8px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding: 10px 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.shell-main { min-width: 0; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: column; gap: 8px; border-right: none; border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .side-top { flex-direction: row; justify-content: space-between; align-items: center; padding: 0; }
  .nav-list { flex-direction: row; overflow-x: auto; gap: 6px; }
  .nav-item { width: auto; white-space: nowrap; padding: 8px 12px; min-height: 40px; }
  .nav-sep, .side-foot { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(() => {
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('amt.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('amt.' + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').trim().toUpperCase();
const N = n => Number(n || 0).toLocaleString();
const fmtT = t => t ? new Date(t).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hm = t => new Date(t).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
const Store = window.AMSStore;
async function cap(n) { if (n === 'downloads') return Store.downloads; if (n === 'db') return S.authed ? Store.db : null; return null; }
const isLead = () => usbMode || S.user?.role === 'lead';

/* ================= state ================= */
let dev = LS.get('dev', null); if (!dev) { dev = 'd' + Math.random().toString(36).slice(2, 7); LS.set('dev', dev); }
const S = {
  mode: window.AndroidBridge || new URLSearchParams(location.search).get('mode') === 'app' ? 'app' : 'web',
  web: 'rounds', app: 'home', user: LS.get('user', null),
  area: LS.get('area', null), room: LS.get('room', ''), manual: false,
  areaTab: 'left', inboxTab: 'move', inboxSel: null, inboxChecked: new Set(),
  feedF: 'all', stTab: 'reprint', stSel: new Set(), stSize: 'a4', stPaste: '',
  cards: [], item: null, imp: null, msg: {}, closeChoice: 'writeoff', confirmReset: false, verify: null, areaPick: false, liveArea: null,
  gate: 'boot', authed: false, team: LS.get('team', []), firstRun: false, gateMsg: null, busy: false
};
let meta = null;                 // round document
let master = new Map(), altIx = new Map();
let serverEv = {};               // docId -> items (all devices)
let mine = [];                   // this device's events for the current round
let dirty = new Set(), writing = false, online = false;
let db = null, dl = null;
const CHUNK = 350;

let usbMode = LS.get('usbMode', false), usbEv = {};   // usbEv: events that arrived by cable (file), per device
function loadMine() { usbEv = meta ? LS.get('usb-' + meta.id, {}) : {}; mine = meta ? LS.get('mine-' + meta.id, []) : []; dirty = new Set(LS.get('dirty-' + (meta?.id || ''), [])); }
function saveMine() { if (meta) { LS.set('mine-' + meta.id, mine); LS.set('dirty-' + meta.id, [...dirty]); } }

function indexMaster(rows) {
  master = new Map(); altIx = new Map();
  for (const r of rows) {
    master.set(r[0], { code: r[0], name: r[1], ccName: r[2], cls: r[3], alt: r[4], raws: r[5] || [], cc: r[6], wo: !!r[7] });
    if (r[4]) altIx.set(r[4], r[0]);
  }
}

/* ================= events → current state ================= */
function allEvents() {
  const m = new Map();
  for (const k in serverEv) for (const e of serverEv[k]) m.set(e.id, e);
  for (const k in usbEv) for (const e of usbEv[k]) m.set(e.id, e);
  for (const e of mine) m.set(e.id, e);
  return [...m.values()].sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
}
let _cache = null, _cacheKey = '';
function compute() {
  const evs = allEvents();
  const key = evs.length + ':' + (evs.at(-1)?.id || '') + ':' + Object.keys(serverEv).length + ':' + master.size;
  if (_cache && key === _cacheKey) return _cache;
  const cur = new Map(), recount = new Set(), hist = new Map();
  const H = (c, txt, e) => { let h = hist.get(c); if (!h) hist.set(c, h = []); h.push({ t: e.t, by: e.by, txt }); };
  for (const e of evs) {
    const c = e.code; let s = cur.get(c);
    if (e.k === 'scan') {
      if (s) { H(c, `สแกนซ้ำที่ ${e.areaName || ''}`, e); continue; }
      cur.set(c, { code: c, t: e.t, by: e.by, dev: e.dev, area: e.area, areaName: e.areaName, shared: !!e.shared, room: e.room || '', ns: !!e.ns, cond: 'ปกติ', remark: '', dec: null, uname: '', flags: { reprint: !!e.ns }, rv: {}, printedAt: 0 });

function labelCC(code) {

      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }), ws = wb.Sheets['_ams'];
      if (!ws) { out.push(`${f.name}: ไม่ใช่ไฟล์ผลนับจากแอป`); bad = true; continue; }
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }), [tag, , round, d, by] = rows[0] || [];
      if (tag !== 'AMS Count USB' || !/^[\w-]{1,40}$/.test(String(d))) { out.push(`${f.name}: รูปแบบไฟล์ไม่ถูกต้อง`); bad = true; continue; }
      if (round !== meta.id) { out.push(`${f.name}: เป็นของรอบนับอื่น ไม่ได้นำเข้า`); bad = true; continue; }
      const items = [];
      for (const r of rows.slice(1)) for (const e of JSON.parse(r[0] || '[]')) if (e && typeof e.id === 'string' && typeof e.code === 'string' && ['scan', 'edit', 'del', 'rv'].includes(e.k)) items.push({ ...e, round: meta.id, dev: String(d) });
      const prev = usbEv[d] || [], ids = new Set(prev.map(e => e.id)), fresh = items.filter(e => !ids.has(e.id));
      usbEv[d] = [...prev, ...fresh].sort((a, b) => a.t - b.t);
      info[d] = { by: String(by || '?'), n: usbEv[d].length, at: Date.now(), file: f.name };
      if (db) for (let k = 0; k * CHUNK < usbEv[d].length; k++) await db.doc(`ev/${meta.id}-${d}-u${k}`).set({ round: meta.id, dev: String(d), items: usbEv[d].slice(k * CHUNK, (k + 1) * CHUNK), at: Date.now(), via: 'usb' });
      out.push(`${f.name}: ${by} · ${N(items.length)} รายการ (ใหม่ ${N(fresh.length)})`);
    } catch (e) { out.push(`${f.name}: อ่านไม่ได้ (${e.message})`); bad = true; }
  }
  LS.set('usb-' + meta.id, usbEv); LS.set('usbInfo-' + meta.id, info); _cache = null;
  S.msg.usb = [out, bad ? 'warn' : 'ok'];
}

/* ================= actions ================= */
let audio;
function beep(kind) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const tones = { ok: [[1320, .08]], dup: [[880, .08], [880, .08]], unk: [[300, .25]], oth: [[1320, .08], [660, .12]] }[kind] || [[1000, .05]];
    let at = audio.currentTime;
    for (const [f, d] of tones) { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; o.type = 'square'; g.gain.value = .06; o.connect(g).connect(audio.destination); o.start(at); o.stop(at + d); at += d + .05; }
  } catch {}
  try { navigator.vibrate?.(kind === 'ok' ? 40 : [80, 60, 80]); } catch {}
}
function resolve(raw) {
  const t = norm(raw); if (!t) return '';
  const first = t.split(/[|;,\s]+/)[0], base = first.split('-')[0];
  for (const c of [t, first, base]) { if (master.has(c)) return c; if (altIx.has(c)) return altIx.get(c); }
  return first;
}
function doScan(raw) {
  const code = resolve(raw); if (!code || !S.area) return;
  if (meta.status !== 'counting') { flash('รอบนี้ยังนับไม่ได้'); return; }
  const prev = compute().cur.get(code);
  if (prev) { beep('dup'); S.cards.unshift({ code, dup: true, dupBy: prev.by, dupT: prev.t }); render(); return; }
  pushEvent({ k: 'scan', code, round: meta.id, area: String(S.area.code), areaName: S.area.name, shared: !!S.area.shared, room: S.room, ns: S.manual });
  const s = compute().cur.get(code);
  beep(!master.has(code) ? 'unk' : isOther(s) ? 'oth' : 'ok');
  S.cards.unshift({ code }); render();
}
function edit(code, fields) { pushEvent({ k: 'edit', code, round: meta.id, ...fields }); render(); }
function save(name, data, mime) {
  if (dl) return dl.save({ filename: name, data, type: mime }).then(r => ['บันทึกไฟล์แล้ว: ' + name + (r?.where ? ' · ' + r.where : ''), 'ok']).catch(e => e?.code === 'declined' ? ['ยกเลิกการบันทึก', ''] : ['บันทึกไม่สำเร็จ (' + (e?.code || e) + ')', 'bad']);
  try { const blob = data instanceof Blob ? data : new Blob([data], { type: mime }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000); return Promise.resolve(['ดาวน์โหลดแล้ว: ' + name, 'ok']); }
  catch { return Promise.resolve(['ดาวน์โหลดไม่ได้ในหน้านี้', 'bad']); }
}

async function stickerPdf(test) {
  if (!window.jspdf) return ['โหลดตัวสร้าง PDF ไม่สำเร็จ ลองรีเฟรช', 'bad'];
  try { await document.fonts?.load('500 20px Prompt'); } catch {}
  const codes = [...S.stSel].slice(0, test ? 1 : 2000), { jsPDF } = window.jspdf;
  const roll = S.stSize === 'roll', w = roll ? 50 : 70, hgt = roll ? 25 : 37.125;
  const pdf = roll ? new jsPDF({ unit: 'mm', format: [w, hgt], orientation: 'l' }) : new jsPDF({ unit: 'mm', format: 'a4' });
  const cv = document.createElement('canvas'); cv.width = Math.round(w * 12); cv.height = Math.round(hgt * 12);
  codes.forEach((code, i) => {
    drawSticker(cv, code);
    const img = cv.toDataURL('image/png');
    if (roll) { if (i) pdf.addPage([w, hgt], 'l'); pdf.addImage(img, 'PNG', 0, 0, w, hgt, undefined, 'FAST'); }
    else { const k = i % 24; if (i && !k) pdf.addPage(); pdf.addImage(img, 'PNG', (k % 3) * w, Math.floor(k / 3) * hgt, w, hgt, undefined, 'FAST'); }
  });
  return await save(`AMS-สติ๊กเกอร์-${codes.length}ดวง.pdf`, pdf.output('blob'), 'application/pdf');
}

function afterRender() {
  const iq = $('#installQr'); if (iq && typeof qrcode === 'function') { const q = qrcode(0, 'M'); q.addData(new URL('install.html', location.href).href); q.make(); const n = q.getModuleCount(), c = iq.getContext('2d'), m = Math.floor(iq.width / (n + 4)), o = Math.floor((iq.width - n * m) / 2); c.fillStyle = '#fff'; c.fillRect(0, 0, iq.width, iq.height); c.fillStyle = '#121826'; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(o + k * m, o + r * m, m, m); }
  const st = $('#stPrev'); if (st) drawSticker(st, [...S.stSel][0] || stickerList(cats())[0] || [...master.keys()][0] || '51000001');
  const it = $('#itemSticker'); if (it) drawSticker(it, S.item);
  if (S.mode === 'app' && S.app === 'scan' && !S.item && !S.areaPick && document.activeElement?.id !== 'scanIn') $('#scanIn')?.focus();
}
document.fonts?.ready?.then(() => render());
render(); connect();
})();
