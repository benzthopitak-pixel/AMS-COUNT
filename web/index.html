/* Layout: one shell, two faces. "คอม" = wide web workspace with stage pills; "เครื่องยิง" = phone column with bottom bar + center scan button.

:root {

<script>

/* ================= helpers ================= */

/* ================= state ================= */

const S = {
  mode: window.AndroidBridge || new URLSearchParams(location.search).get('mode') === 'app' ? 'app' : 'web',
  web: 'rounds', app: 'home', user: LS.get('user', null),
  area: LS.get('area', null), room: LS.get('room', ''), manual: false,
  areaTab: 'left', inboxTab: 'move', inboxSel: null, inboxChecked: new Set(),
  feedF: 'all', stTab: 'reprint', stSel: new Set(), stSize: LS.get('stSize', 'roll'), stMode: 'print', lblId: LS.get('lblId', 'std'), xls: null, xlsSel: new Set(), stCopies: 1, stPaste: '',
  cards: [], item: null, imp: null, msg: {}, closeChoice: 'writeoff', confirmReset: false, verify: null, areaPick: false, liveArea: null,
  gate: 'boot', authed: false, team: LS.get('team', []), firstRun: false, gateMsg: null, busy: false

let meta = null;                 // round document
let master = new Map(), altIx = new Map();
let serverEv = {};               // docId -> items (all devices)
let mine = [];                   // this device's events for the current round
let dirty = new Set(), writing = false, online = false;
let db = null, dl = null, RENDERING = false;   // RENDERING: a focused field being replaced fires a stale change event — ignore it

let usbMode = LS.get('usbMode', false), usbEv = {};   // usbEv: events that arrived by cable (file), per device

function indexMaster(rows) {
  master = new Map(); altIx = new Map();
  for (const r of rows) {
    master.set(r[0], { code: r[0], name: r[1], ccName: r[2], cls: r[3], alt: r[4], raws: r[5] || [], cc: ccKey(r[6]), wo: !!r[7] });

/* ================= events → current state ================= */
function allEvents() {
  const m = new Map();
  for (const k in serverEv) for (const e of serverEv[k]) m.set(e.id, e);

let _cache = null, _cacheKey = '';
function compute() {
  const evs = allEvents();
  const key = evs.length + ':' + (evs.at(-1)?.id || '') + ':' + Object.keys(serverEv).length + ':' + master.size;
  if (_cache && key === _cacheKey) return _cache;

const SRC = { qr: ['สแกน QR', 'c-ok'], barcode: ['สแกนบาร์โค้ด', 'c-gray'], manual: ['พิมพ์ / ค้นหาบนเครื่อง', 'c-warn'], web: ['บันทึกบนเว็บ', 'c-blue'] };

    <div style="display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto">${l.map(d => `<div class="row" style="align-items:center;gap:8px;background:#f8f9fc;border-radius:12px;padding:8px 10px"><span style="flex:1;min-width:0"><b class="mono">${esc(d.code)}</b><br><span class="sub">${esc(master.get(d.code)?.name || '')} · ${esc(d.first?.by || '')} นับก่อน ${d.first ? hm(d.first.t) : ''} ที่ ${esc(d.first?.areaName || '')}</span></span><button class="btn sm red" data-a="dupdrop" data-v="${esc(d.code)}" data-id="${esc(d.id)}">ลบ</button></div>`).join('')}</div>

const lostOf = code => compute().lost.get(code) || null;
// choices for an item nobody has scanned: found (no sticker / with its condition) or lost
const markChoices = (code, act, extra = '') => {
  const L = lostOf(code);
  if (L) return `<div class="card" style="background:var(--bad-soft, #fef3f2);padding:12px;gap:6px"><b style="color:var(--bad-ink)">บันทึกว่าสูญหายแล้ว</b><span class="sub">${esc(L.by)} · ${fmtT(L.t)}${L.remark ? ' · ' + esc(L.remark) : ''}</span><div class="row"><button class="btn sm" data-a="unlost" data-v="${esc(code)}">ยกเลิก (กลับเป็นรอตรวจ)</button></div></div>`;

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${B('ปกติ', 'พบ · ไม่มีสติกเกอร์', 'pri')}${B('ชำรุด', 'พบ · ชำรุด', '')}${B('รอซ่อม', 'พบ · รอซ่อม', '')}${B('ไม่ใช้งาน', 'พบ · ไม่ใช้งาน', '')}</div>

const ccClosed = code => compute().ccDone.get(String(code)) || null;
const closeTxt = d => `ปิดงานโดย ${esc(d.by)} · ${fmtT(d.t)}${d.left ? ` · ไม่พบ ${d.left} รายการ` : ''}`;
const isOther = s => { const a = master.get(s.code); return !!(a && !s.shared && s.area && a.cc && ccKey(s.area) !== ccKey(a.cc)); };
// same CC code but the file spells the department differently → warn only, never counts as a move
const ccNameOf = code => (meta?.areas || []).find(x => String(x.code) === String(code))?.name || String(code);
const ccNameDiff = code => (meta?.ccNames || {})[String(code)] || null;
const isBorrowed = s => isOther(s) && (s.dec === 'borrowed' || s.rv.move === 'keep');   // borrowed from another CC: found, but never a CC move
const isMoveCase = s => isOther(s) && !isBorrowed(s);
const isMoved = s => isMoveCase(s);
const counted = a => !a.wo;   // rows already written off before this round are not counted

function cats() {
  const { cur } = compute(), out = { move: [], unk: [], dmg: [], reprint: [], namebad: [], transfer: [], cleared: [] };

    if (!a && !s.rv.unk) out.unk.push(s);
    if ((s.cond === 'ชำรุด' || s.cond === 'รอซ่อม') && !s.rv.dmg) out.dmg.push(s);
    if (s.flags.reprint) out.reprint.push(s);
    if (s.flags.namebad) out.namebad.push(s);

/* ================= storage: Artifact database, or this browser only ================= */
function scheduleFlush() { clearTimeout(scheduleFlush.t); scheduleFlush.t = setTimeout(flush, 700); }
async function flush() {

    for (const k of [...dirty]) {
      const items = mine.slice(k * CHUNK, (k + 1) * CHUNK);
      await db.doc(`ev/${meta.id}-${dev}-${k}`).set({ round: meta.id, dev, items, at: Date.now() });
      dirty.delete(k); saveMine();
    }
    online = true;
  } catch (e) { online = false; clearTimeout(flush.r); flush.r = setTimeout(flush, 8000); }

}
function pushEvent(e) {
  if (!meta) return;
  const ev = { id: dev + '-' + Date.now().toString(36) + '-' + mine.length, t: Date.now(), by: S.user?.name || '?', dev, ...e };
  mine.push(ev); dirty.add(Math.floor((mine.length - 1) / CHUNK)); saveMine(); _cache = null;
  scheduleFlush();

}

  if (!db) return 0;

}
// ---------- jobs: every imported file is its own job (meta/<id>, master/<id>/cN); the old single round is meta/round ----------
let jobs = LS.get('jobs', null), jobId = LS.get('jobId', null);
const metaKeyOf = m => m?.metaKey || 'meta/round';
const masterKeyOf = (m, i) => (m?.masterKey || 'master/c') + i;
const jobEntry = m => ({ id: m.id, name: m.name, status: m.status, createdAt: m.createdAt || 0, closedAt: m.closedAt || 0, fileName: m.fileName || '', total: m.total ?? null, areas: (m.areas || []).filter(a => !a.shared).length, metaKey: metaKeyOf(m), masterKey: m.masterKey || 'master/c' });

async function saveJobs(list) { jobs = list; LS.set('jobs', list); if (db && isLead()) await db.doc('jobs').set({ list }); }
async function saveMeta(m) {
  if (m && !usbMode && S.team.length) m = { ...m, team: S.team.filter(u => u.active).map(u => ({ name: u.name, role: u.role, code: u.code })) };

  if (db) { try { if (m) { await db.doc(metaKeyOf(m)).set(m); await saveJobs([jobEntry(m), ...(jobs || []).filter(j => j.id !== m.id)]); } online = true; } catch (e) { online = false; flash('บันทึกขึ้นระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); } }

}
async function saveMaster(rows, m) {

let unsubEv = null, evRound = null, unsubMeta = null;

  if (pkg?.kind !== 'ams-package' || !pkg.meta?.id || !Array.isArray(pkg.rows)) return ['ไฟล์นี้ไม่ใช่แพ็กเกจ AMS', 'bad'];
  meta = pkg.meta; LS.set('meta', meta); jobId = meta.id; LS.set('jobId', meta.id); indexMaster(pkg.rows); LS.set('master', pkg.rows); LS.set('masterVer', meta.ver);
  loadMine();
  const others = {}; let n = 0;
  for (const e of pkg.events || []) if (e && e.id && e.dev !== dev) { (others[e.dev] ||= []).push(e); n++; }
  usbEv = others; LS.set('usb-' + meta.id, usbEv); _cache = null;
  return [`นำเข้าแล้ว: ${meta.name} · ${N(master.size)} รหัส · ผลนับเครื่องอื่น ${N(n)} รายการ`, 'ok'];
}

  const myCC = new Set(mine.filter(e => String(e.code).startsWith('#CC:')).map(e => e.code.slice(4)));
  for (const [cc, d] of C.ccDone) if (myCC.has(cc)) view.push(['', `ปิดงาน CC ${cc} ${ccNameOf(cc)}`, '', '', '', 'นับครบแล้ว', '', '', '', '', d.left ? `ไม่พบ ${d.left} รายการ` : '', d.by, fmtT(d.t), '']);
  const raw = [['AMS Count USB', 1, meta.id, dev, S.user?.name || '', Date.now(), mine.length]]; let buf = [], len = 0;
  for (const e of mine) { const j = JSON.stringify(e); if (len + j.length > 30000 && buf.length) { raw.push(['[' + buf.join(',') + ']']); buf = []; len = 0; } buf.push(j); len += j.length + 1; }
  if (buf.length) raw.push(['[' + buf.join(',') + ']']);

  wb.Workbook = { Sheets: [{ Hidden: 0 }, { Hidden: 1 }] };
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
  const r = await save(`AssetSync-ผลนับ-${S.user?.name || 'ไม่ระบุ'}-${dev}-${stamp}.xlsx`, new Uint8Array(XLSX.write(wb, { bookType: 'xlsx', type: 'array' })), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  if (r[1] === 'ok') { LS.set('usbOut-' + meta.id, mine.length); LS.set('usbLast', { name: r[0].replace(/^บันทึกไฟล์แล้ว: /, '').split(' · ')[0], where: r[0].split(' · ')[1] || 'Download', at: Date.now() }); }

async function importReports(files) {
  const out = [], info = LS.get('usbInfo-' + meta.id, {}); let bad = false;
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }), ws = wb.Sheets['_ams'];
      if (!ws) { out.push(`${f.name}: ไม่ใช่ไฟล์ผลนับจากแอป`); bad = true; continue; }
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }), [tag, , round, d, by] = rows[0] || [];
      if (tag !== 'AMS Count USB' || !/^[\w-]{1,40}$/.test(String(d))) { out.push(`${f.name}: รูปแบบไฟล์ไม่ถูกต้อง`); bad = true; continue; }
      if (round !== meta.id) { out.push(`${f.name}: เป็นของรอบนับอื่น ไม่ได้นำเข้า`); bad = true; continue; }
      const items = [];
      for (const r of rows.slice(1)) for (const e of JSON.parse(r[0] || '[]')) if (e && typeof e.id === 'string' && typeof e.code === 'string' && ['scan', 'edit', 'del', 'rv'].includes(e.k)) items.push({ ...e, round: meta.id, dev: String(d) });
      const prev = usbEv[d] || [], ids = new Set(prev.map(e => e.id)), fresh = items.filter(e => !ids.has(e.id));
      usbEv[d] = [...prev, ...fresh].sort((a, b) => a.t - b.t);
      info[d] = { by: String(by || '?'), n: usbEv[d].length, at: Date.now(), file: f.name };
      if (db) for (let k = 0; k * CHUNK < usbEv[d].length; k++) await db.doc(`ev/${meta.id}-${d}-u${k}`).set({ round: meta.id, dev: String(d), items: usbEv[d].slice(k * CHUNK, (k + 1) * CHUNK), at: Date.now(), via: 'usb' });
      out.push(`${f.name}: ${by} · ${N(items.length)} รายการ (ใหม่ ${N(fresh.length)})`);
    } catch (e) { out.push(`${f.name}: อ่านไม่ได้ (${e.message})`); bad = true; }
  }
  LS.set('usb-' + meta.id, usbEv); LS.set('usbInfo-' + meta.id, info); _cache = null;
  S.msg.usb = [out, bad ? 'warn' : 'ok'];
}

/* ---------- search (item without a sticker) ---------- */
function searchHits() {
  const q = norm(S.search.q), { cur } = compute(), here = String(S.area?.code || '');
  let list = [...master.values()].filter(a => counted(a));
  if (!S.search.all) list = list.filter(a => !cur.has(a.code));
  if (q) list = list.filter(a => a.code.includes(q) || norm(a.name).includes(q) || (a.alt && a.alt.includes(q)) || norm(a.ccName).includes(q));
  else list = list.filter(a => String(a.cc) === here);
  list.sort((a, b) => (String(b.cc) === here) - (String(a.cc) === here) || a.code.localeCompare(b.code));
  return { total: list.length, list: list.slice(0, 60) };
}
function searchSheet() {
  const { cur } = compute(), r = searchHits(), q = S.search.q.trim();

  return h + `</div></div>`;
}
